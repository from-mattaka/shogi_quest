<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>次の一手 問題集</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665d; --line: #ddd6c8;
  --accent: #2f6db5; --ok: #1f8a4c; --ng: #c0392b; --warn: #b7791f;
  --board: #e8c482; --board-line: #6d4c1d; --cell-sel: rgba(47,109,181,.45);
  --cell-dest: rgba(47,109,181,.22); --cell-last: rgba(214,120,30,.35); --cell-hint: rgba(31,138,76,.4);
  --promoted: #b0261b; --piece: #1a1208;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #222429; --text: #e9e6df; --muted: #a39e94; --line: #3a3d44;
    --accent: #6ea5ec; --ok: #4cc27f; --ng: #f0766a; --warn: #e3b35a;
    --board: #c9a466; --board-line: #4d3412;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #222429; --text: #e9e6df; --muted: #a39e94; --line: #3a3d44;
  --accent: #6ea5ec; --ok: #4cc27f; --ng: #f0766a; --warn: #e3b35a;
  --board: #c9a466; --board-line: #4d3412;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.55; }
header { padding: 14px 16px 6px; max-width: 1040px; margin: 0 auto; }
h1 { font-size: 1.25rem; margin: 0 0 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: .88rem; color: var(--muted); }
.filters label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
select, button { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
main { max-width: 1040px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 18px;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
.left { --bw: min(calc(100vw - 32px), 450px); width: var(--bw); }
.hand { display: flex; align-items: center; gap: 4px; min-height: calc(var(--bw) / 9 * .9);
  padding: 2px 4px; font-size: .85rem; color: var(--muted); }
.hand .who { margin-right: 6px; white-space: nowrap; }
.hp { position: relative; border: 1px solid transparent; background: none; border-radius: 6px; cursor: default;
  font-size: calc(var(--bw) / 9 * .52); width: calc(var(--bw) / 9 * .85); height: calc(var(--bw) / 9 * .85);
  color: var(--text); padding: 0; }
.hp.mine { cursor: pointer; }
.hp.mine:hover { border-color: var(--line); }
.hp.sel { background: var(--cell-sel); }
.hp.hint { background: var(--cell-hint); }
.hp .n { position: absolute; right: -2px; bottom: -4px; font-size: .62em; color: var(--muted); }
.boardwrap { position: relative; }
.files, .ranks { display: grid; color: var(--muted); font-size: .72rem; text-align: center; }
/* マスの大きさは駒の有無に関係なく固定（幅 --cw × 高さ --ch） */
.left { --cw: calc((var(--bw) - 22px) / 9); --ch: calc(var(--cw) * 1.08); }
.files { grid-template-columns: repeat(9, var(--cw)); padding-left: 2px; }
.boardrow { display: flex; }
.board { display: grid; grid-template-columns: repeat(9, var(--cw)); grid-template-rows: repeat(9, var(--ch));
  box-sizing: content-box; background: var(--board); border: 2px solid var(--board-line); }
.ranks { grid-template-rows: repeat(9, var(--ch)); padding-top: 2px; width: 18px; align-items: center; }
.cell { width: var(--cw); height: var(--ch); overflow: hidden; box-sizing: border-box;
  border: .5px solid var(--board-line); display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--bw) / 9 * .56); color: var(--piece); cursor: pointer; user-select: none; position: relative;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif; font-weight: 600; }
.cell.opp span { transform: rotate(180deg); display: inline-block; }
.cell.prom { color: var(--promoted); }
.cell.last { background: var(--cell-last); }
.cell.sel { background: var(--cell-sel); }
.cell.dest::after { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: var(--accent); opacity: .55; }
.cell.dest.cap::after { width: 86%; height: 86%; background: none; border: 3px solid var(--accent); }
.cell.hint { background: var(--cell-hint); }
.promo { display: none; gap: 8px; justify-content: center; margin-top: 8px; }
.promo.show { display: flex; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.meta { font-size: .85rem; color: var(--muted); }
.tag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; margin-right: 6px; }
.tag.c0 { color: var(--ng); } .tag.c1 { color: var(--ng); } .tag.c2 { color: var(--warn); } .tag.c3 { color: var(--muted); }
.q { font-size: 1.1rem; font-weight: 700; margin: 8px 0 4px; }
.verdict { font-size: 1.2rem; font-weight: 700; margin: 4px 0 8px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); } .verdict.un { color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; margin-top: 8px; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .8rem; }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.line { cursor: pointer; }
tr.line:hover td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tr.line.active td { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.diff { font-size: .8rem; font-weight: 600; } .diff.up { color: var(--ok); } .diff.down { color: var(--ng); }
.pv { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.mark-ok { color: var(--ok); font-weight: 700; } .mark-ng { color: var(--ng); font-weight: 700; }
.replay { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.replay .pos { font-size: .85rem; color: var(--muted); min-width: 9em; }
.statsrow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; }
.stats { font-size: .85rem; color: var(--muted); }
.btn.small { font-size: .78rem; padding: 2px 8px; border-radius: 6px; }
.hidden { display: none !important; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>次の一手 問題集</h1>
  <div class="filters">
    <span>出題:</span>
    <label><input type="checkbox" class="fcat" value="詰み逃し" checked>詰み逃し</label>
    <label><input type="checkbox" class="fcat" value="大悪手" checked>大悪手</label>
    <label><input type="checkbox" class="fcat" value="悪手" checked>悪手</label>
    <label><input type="checkbox" class="fcat" value="疑問手" checked>疑問手</label>
    <select id="fmode"><option value="">全持ち時間</option></select>
    <select id="fswing" title="期待勝率（自分視点）の変化で絞り込む">
      <option value="">局面の変化: すべて</option>
      <option value="even2bad">互角 → 劣勢（勝率 40〜60% → 40% 未満）</option>
      <option value="good2bad">優位 → 不利（勝率 60% 以上 → 50% 未満）</option>
    </select>
    <label><input type="checkbox" id="funsolved">未正解のみ</label>
    <select id="forder"><option value="new">新しい順</option><option value="random">ランダム</option></select>
  </div>
  <div class="statsrow">
    <div class="stats" id="stats"></div>
    <button class="btn small" id="resetFiltered" title="今の絞り込み条件（カテゴリ・持ち時間・局面の変化）に合う問題の記録だけ消します">絞り込み中の記録をリセット</button>
    <button class="btn small" id="resetAll">全記録をリセット</button>
  </div>
</header>
<main id="main">
  <div class="left">
    <div class="hand" id="handTop"></div>
    <div class="boardwrap">
      <div class="files" id="files"></div>
      <div class="boardrow"><div class="board" id="board"></div><div class="ranks" id="ranks"></div></div>
    </div>
    <div class="hand" id="handBottom"></div>
    <div class="promo" id="promo">
      <button class="btn primary" id="promoYes">成る</button>
      <button class="btn" id="promoNo">成らない</button>
      <button class="btn" id="promoCancel">やめる</button>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn">◀ 前の問題</button>
      <button class="btn" id="hintBtn">ヒント</button>
      <button class="btn" id="giveupBtn">答えを見る</button>
      <button class="btn" id="retryBtn">もう一度</button>
      <button class="btn primary" id="nextBtn">次の問題 ▶</button>
    </div>
  </div>
  <div class="right">
    <div class="panel">
      <div class="meta" id="meta"></div>
      <div class="q" id="question"></div>
      <div class="meta" id="situation"></div>
      <div id="answer" class="hidden">
        <div class="verdict" id="verdict"></div>
        <div id="verdictNote" class="meta"></div>
        <table>
          <thead><tr><th></th><th>指し手</th><th class="num">評価値の変化</th><th class="num">勝率の変化</th></tr></thead>
          <tbody id="lines"></tbody>
        </table>
        <div class="meta" style="margin-top:6px">行をクリックすると、その読み筋を盤上で再生できます。</div>
        <div class="replay">
          <button class="btn" id="rpStart">⏮</button>
          <button class="btn" id="rpPrev">◀</button>
          <button class="btn" id="rpNext">▶</button>
          <button class="btn" id="rpEnd">⏭</button>
          <span class="pos" id="rpPos"></span>
        </div>
        <div class="meta" style="margin-top:10px">対局レポート: <a id="reportLink" target="_blank" rel="noopener"></a></div>
      </div>
    </div>
  </div>
</main>
<div class="empty hidden" id="empty">条件に合う問題がありません。</div>

  $("verdictNote").textContent = note;
  const rows = cur.cands.map((c, i) => ({ label: `AI ${i + 1}位`, mark: c.ok ? "mark-ok" : "", c, mine: c.usi === userUsi }));
  rows.push({ label: "実戦", mark: "mark-ng", c: cur.actual, mine: cur.actual.usi === userUsi });
  window._lines = rows;
  $("lines").innerHTML = rows.map((r, i) => `<tr class="line" data-i="${i}">
      <td class="${r.mark}" style="white-space:nowrap">${r.label}${r.mine ? "<br><small>あなた</small>" : ""}</td>
      <td>${r.c.ja}<div class="pv">${r.c.pv_ja || ""}</div></td>
      <td class="num">${evalChange(cur.raw_before, r.c.raw)}</td>
      <td class="num">${pct(cur.wr_before)} → ${pct(r.c.wr)}${diffSpan(r.c.wr == null ? null : Math.round((r.c.wr - cur.wr_before) * 100), "pt")}</td></tr>`).join("");
  updateButtons(); render(); renderStats();
  if (userUsi === null) selectLine(0, 1);
}

$("lines").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.line");
  if (tr) selectLine(+tr.dataset.i, 1);
});
function selectLine(i, k) {
  activeLine = i;
  document.querySelectorAll("tr.line").forEach((tr) => tr.classList.toggle("active", +tr.dataset.i === i));
  replay = { moves: window._lines[i].c.pv, k };
  showReplay();
}
function showReplay() {
  let pos = parseSfen(cur.sfen), lm = cur.prev;
  for (let j = 0; j < replay.k; j++) { pos = applyUsi(pos, replay.moves[j]); lm = replay.moves[j]; }
  view = pos; lastMove = lm;
  $("rpPos").textContent = replay.k === 0 ? "問題の局面" : `${cur.ply + replay.k - 1}手目まで（${replay.k}/${replay.moves.length}）`;
  render();
}
function step(fn) { if (!replay) { if (window._lines) selectLine(0, 0); else return; } replay.k = Math.max(0, Math.min(replay.moves.length, fn(replay.k))); showReplay(); }
$("rpStart").onclick = () => step(() => 0);
$("rpPrev").onclick = () => step((k) => k - 1);
$("rpNext").onclick = () => step((k) => k + 1);
$("rpEnd").onclick = () => step(() => Infinity);

// ---------- ボタン・キーボード ----------
$("prevBtn").onclick = () => { if (idx > 0) { idx--; load(); } };
$("nextBtn").onclick = () => { if (idx < list.length - 1) { idx++; load(); } };
$("hintBtn").onclick = () => { hintOn = true; render(); };
$("giveupBtn").onclick = giveUp;
$("retryBtn").onclick = () => load();
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (answered && e.key === "ArrowRight") { $("rpNext").click(); e.preventDefault(); }
  if (answered && e.key === "ArrowLeft") { $("rpPrev").click(); e.preventDefault(); }
  if (e.key === "n") $("nextBtn").click();
  if (e.key === "p") $("prevBtn").click();
  if (e.key === "Escape") { closePromo(); selected = null; render(); }
});

const modes = [...new Set(PROBLEMS.map((p) => p.time_mode))].sort();
$("fmode").innerHTML += modes.map((m) => `<option value="${m}">${m.replace("shogi", "")}分</option>`).join("");
document.querySelectorAll(".fcat, #fmode, #fswing, #funsolved, #forder").forEach((el) => el.addEventListener("change", buildList));
for (const [k, f] of Object.entries(SWINGS)) {
  const opt = document.querySelector(`#fswing option[value="${k}"]`);
  opt.textContent += `（${PROBLEMS.filter(f).length}問）`;
}
function resetRecords(targets, label) {
  const n = targets.filter((p) => record[p.id]).length;
  if (!n) { alert(`${label}に、消す記録はありません。`); return; }
  if (!confirm(`${label}の記録（${n}問分）を消します。元に戻せません。よろしいですか？`)) return;
  for (const p of targets) delete record[p.id];
  saveRecord(); buildList();
}
$("resetAll").onclick = () => resetRecords(PROBLEMS, "全問題");
$("resetFiltered").onclick = () => resetRecords(filtered(), "絞り込み中の問題");
buildList();
</script>
</body>
</html>
