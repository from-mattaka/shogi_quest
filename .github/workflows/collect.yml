name: Collect Shogi Quest games

on:
  schedule:
    - cron: "00 10 * * *" # 1日1回 毎日 01:00 JST。取得元は持ち時間ごとに最新30局のみ返す
  workflow_dispatch: {}     # 手動テスト用

permissions:
  contents: write

concurrency:
  group: collect-shogi-quest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      # 任意: リポジトリ Variables で上書きできる（未設定なら config.json の値）
      SHOGI_QUEST_PLAYER: ${{ vars.SHOGI_QUEST_PLAYER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect games
        run: python collect.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md docs/ai/AI_CONTEXT.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          NEW=$(git diff --cached --name-only --diff-filter=A -- 'data/csa/*.csa' | wc -l)
          git commit -m "data: add ${NEW} game(s) ($(date '+%Y-%m-%d %H:%M JST'))"
          git pull --rebase --autostash
          git push
